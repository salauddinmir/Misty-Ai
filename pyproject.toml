[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "misty-brain"
version = "0.1.0"
description = "MISTY - An LLM-independent Artificial Cognitive System"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "networkx>=3.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["brain*", "tools*", "database*", "apps*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Focus CI on real bugs and clarity; annotation style rules (UP006, UP035,
# FA100) are excluded because the codebase predates Python 3.9 generics.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "PERF", # performance
    "RUF",  # ruff-specific
]
ignore = [
    "UP006",  # non-pep585-annotation
    "UP035",  # deprecated-import
    "FA100",  # future-rewritable-type-annotation
    "N818",   # error-suffix-on-exception-name
    "PERF203",# try-except-in-loop
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
